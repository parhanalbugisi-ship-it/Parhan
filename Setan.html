 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Klik Ini Sayang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    #btn {
      color: white;
      font-size: 32px;
      padding: 20px 40px;
      border: 2px solid red;
      cursor: pointer;
      text-align: center;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    #setan {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("https://images.unsplash.com/photo-1509248961158-e54f6934749c");
      background-size: cover;
      background-position: center;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div id="btn" onclick="munculSetan()">KLIK INI SAYANG 😘</div>

  <div id="setan"></div>

  <script>
    function munculSetan() {
      document.getElementById("btn").style.display = "none";
      document.getElementById("setan").style.display = "block";
    }
  </script>

</body>
</html>
